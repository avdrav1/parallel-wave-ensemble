# Builds the site from templates/ and content/ (tools/build.mjs) and publishes
# it to GitHub Pages. Runs on every push to main, including saves from Pages CMS.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install ImageMagick
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp
      # Graded photos are reused while the photo and the grade are unchanged,
      # so a text edit publishes quickly.
      - uses: actions/cache@v6
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('content/photos/**', 'tools/build.mjs') }}
          restore-keys: photos-
      - name: Build
        run: node tools/build.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Branch runs (workflow_dispatch) only check that the site builds.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
